[project]
name = "books"
version = "0.1.0"
description = "CLI tools for books & reading data (Calibre -> Obsidian, Kobo highlights export)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "isbnlib>=3.10",
    "rapidfuzz>=3.6",
    "python-frontmatter>=1.1",
    "ruamel.yaml>=0.18",
    "rich>=13",
]

[project.optional-dependencies]
# Heavy, third-party deps for the `audible` capability only (the documented
# exception to the stdlib-only rule). We depend on the maintained `audible` +
# `audible-cli` packages rather than reimplementing auth, the license/voucher
# flow, download, or annotations ourselves. `cryptography` is
# optional-but-recommended: it accelerates the `audible` package's voucher
# decryption / activation bytes.
audible = [
    "audible>=0.10",
    "audible-cli>=0.3",
    "cryptography>=42",
    "faster-whisper>=1.0",
    "openai>=1.0",
    "SpeechRecognition>=3.10",
    "pydub>=0.25",
]

[project.scripts]
books = "books.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["books"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer's idiomatic pattern is `param: T = typer.Option(...)` in defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
