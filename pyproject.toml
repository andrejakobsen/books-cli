[project]
name = "booktools"
version = "0.1.0"
description = "CLI tools for books & reading data (Calibre -> Obsidian, Kobo highlights export)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
books = "booktools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["booktools"]
